global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: linux
    static_configs:
      - targets: ["192.168.56.20:9100"]
        labels: { host: lin01, os: linux }
      - targets: ["192.168.56.30:9100"]
        labels: { host: mon01, os: linux }

  - job_name: windows
    static_configs:
      - targets: ["192.168.56.10:9182"]
        labels: { host: dc01, os: windows }
