groups:
  - name: infraready
    rules:
      - alert: HoteInjoignable
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Cible {{ $labels.host }} injoignable (job {{ $labels.job }})"

      - alert: DisqueLinuxPresquePlein
        expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) * 100 > 80
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Disque {{ $labels.mountpoint }} sur {{ $labels.host }} > 80 %"

      - alert: DisqueWindowsPresquePlein
        expr: (1 - windows_logical_disk_free_bytes{volume="C:"} / windows_logical_disk_size_bytes{volume="C:"}) * 100 > 80
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Volume C: sur {{ $labels.host }} > 80 %"

      - alert: CPUEleve
        expr: 100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "CPU > 85 % sur {{ $labels.host }}"
