---
# Mises a jour, hostname, paquets de base (LINUX01 + OPS01)
- name: Base Linux
  hosts: linux:ops
  become: true
  tasks:
    - name: Mise a jour complete
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Nom d'hote = nom d'inventaire
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Paquets de base
      ansible.builtin.apt:
        name: [git, curl, wget, gnupg, ca-certificates, apt-transport-https]
        state: present

    - name: Redemarrage necessaire ?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Information redemarrage
      ansible.builtin.debug:
        msg: "Redemarrage requis sur {{ inventory_hostname }} : redemarrez puis verifiez les services."
      when: reboot_flag.stat.exists
