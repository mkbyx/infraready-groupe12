---
# node_exporter sur LINUX01 (port 9100)
- name: node_exporter
  hosts: linux
  become: true
  vars:
    # Verifier la version courante sur la page officielle des releases Prometheus
    node_exporter_version: "1.8.2"
  tasks:
    - name: Utilisateur systeme dedie
      ansible.builtin.user:
        name: node_exporter
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Telechargement de l'archive officielle
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extraction
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: true
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: Installation du binaire
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: node_exporter
        group: node_exporter
        mode: "0755"
      notify: restart node_exporter

    - name: Unite systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: Service active au demarrage
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Verification locale des metriques
      ansible.builtin.uri:
        url: http://localhost:9100/metrics
        return_content: false
      register: ne_check
      retries: 5
      delay: 2
      until: ne_check.status == 200

  handlers:
    - name: restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
