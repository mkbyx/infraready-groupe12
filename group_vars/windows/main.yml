---
ansible_user: Administrator
# Le mot de passe est dans le Vault : voir vault.yml.example
ansible_password: "{{ vault_windows_admin_password }}"
ansible_connection: winrm
ansible_port: 5986
ansible_winrm_transport: ntlm
ansible_winrm_scheme: https
# Limite connue : certificat auto-signe en labo => validation desactivee.
# En production : certificat d'une PKI interne + validation activee.
ansible_winrm_server_cert_validation: ignore

windows_groups:
  - name: GG_Admins_Lab
    description: Administrateurs du laboratoire
  - name: GG_Users_Lab
    description: Utilisateurs standard du laboratoire
windows_users:
  - name: tuser1
    firstname: Test
    surname: Un
    group: GG_Admins_Lab
  - name: tuser2
    firstname: Test
    surname: Deux
    group: GG_Users_Lab
  - name: tuser3
    firstname: Test
    surname: Trois
    group: GG_Users_Lab

windows_exporter_version: "0.30.5"   # a verifier sur la page des releases avant usage
windows_exporter_msi_url: "https://github.com/prometheus-community/windows_exporter/releases/download/v{{ windows_exporter_version }}/windows_exporter-{{ windows_exporter_version }}-amd64.msi"
