name: Validate infrastructure code
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python -m pip install --user ansible-core yamllint
      - name: yamllint
        run: python -m yamllint -d "{extends: relaxed, rules: {line-length: disable}}" playbooks inventory monitoring files .github
      - name: Syntax-check playbooks
        run: |
          find playbooks -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 -r -n1 ansible-playbook -i inventory/hosts.ini --syntax-check
      - name: Detect obvious secrets
        run: |
          if grep -rEIn --exclude-dir=.git --exclude-dir=.github "(password|passwd|secret|token)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9]{6,}" . ; then
            echo "Secret potentiel detecte"; exit 1
          fi
